name: Mux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile check
        run: cargo check --all-targets --locked

      - name: Unit tests
        run: cargo test --all-targets --locked

  smoke-tests:
    name: Smoke tests (ubuntu)
    runs-on: ubuntu-latest
    needs: rust-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mux binary
        run: cargo build --locked

      - name: Run C/C++ smoke flows
        shell: bash
        run: |
          set -euo pipefail

          BIN="$GITHUB_WORKSPACE/target/debug/mux"
          WORKDIR="$(mktemp -d)"

          # C template smoke
          cd "$WORKDIR"
          "$BIN" init demo_c --lang c
          cd demo_c
          "$BIN" build
          "$BIN" run
          "$BIN" test

          # C add/remove smoke
          cd ..
          mkdir -p dep-lib
          cat > dep-lib/dep.h << 'H'
          int dep_add(int a, int b);
          H
          cat > dep-lib/dep.c << 'C'
          #include "dep.h"
          int dep_add(int a, int b) { return a + b; }
          C

          cd demo_c
          "$BIN" add ../dep-lib
          "$BIN" build
          "$BIN" test
          "$BIN" remove dep-lib
          "$BIN" build
          "$BIN" test

          # C++ template smoke
          cd "$WORKDIR"
          "$BIN" init demo_cpp --cpp
          cd demo_cpp
          "$BIN" build
          "$BIN" test
